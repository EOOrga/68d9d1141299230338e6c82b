name: amena_vallee_rabio
description: Local operations workspace for appointment booking, patient records, staff training, and audit notes.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: docs/icon.png
  adaptive_icon_background: "#B81FFF"
  adaptive_icon_foreground: docs/icon.png
